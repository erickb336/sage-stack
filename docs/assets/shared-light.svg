<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="One shared core, two thin adapters: the Claude Code plugin and the Codex plugin each add only their own hooks, agents or tools and a launcher. Both use the same shared code, sage-core (routes, rules, the logbook and the merge check) and the board. Both write one logbook for each project, so either chief and the board see the same tasks, runs, verdicts and gates.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
